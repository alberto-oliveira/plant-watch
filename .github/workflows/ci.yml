# Continuous integration: builds the app, runs the unit tests and Lint on every
# pull request (whatever its base branch, so stacked PRs are checked too) and on
# every push to dev or main. Nothing is signed or published here: the release
# signing settings only exist on the developer's machine.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same JDK as on the development machine (CLAUDE.md: compile with JDK 21).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Android SDK with the platform the app compiles against (compileSdk 37).
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"

      # Gradle with caching of downloaded dependencies between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build, unit tests and Lint
        run: ./gradlew assembleDebug testDebugUnitTest lint --console=plain

      # Keep the reports downloadable from the run page, even if a step failed.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
