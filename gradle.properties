# Memory for the Gradle daemon. If WSL runs out of memory, tune this
# (and the limit in .wslconfig) rather than the project structure.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Reuse outputs between builds and configure faster.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Use AndroidX libraries (the modern support libraries).
android.useAndroidX=true

# Kotlin code style for IDE formatting.
kotlin.code.style=official

# Each module's R class contains only its own resources (smaller, faster builds).
android.nonTransitiveRClass=true
