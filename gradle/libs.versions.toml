# Version catalog: the single place where dependency versions live.
# Build scripts reference entries as `libs.<name>` (dashes become dots),
# e.g. `androidx-core-ktx` -> `libs.androidx.core.ktx`.

[versions]
agp = "9.5.0"                  # Android Gradle Plugin
kotlin = "2.4.21"              # Kotlin compiler (also the Compose compiler plugin version)
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"      # BOM = "bill of materials": pins all Compose libs to compatible versions
room = "2.8.5"                 # Room database (runtime, compiler and Gradle plugin share this version)
ksp = "2.3.13"                 # Kotlin Symbol Processing: runs code generators such as Room's compiler
navigation = "2.10.2"          # Navigation Compose: screens and back stack
datastore = "1.3.0"            # DataStore: small key-value settings storage
work = "2.12.0"                # WorkManager: background jobs (the daily reminder)
coil = "3.6.3"                 # Image loading for plant photos (Compose)
retrofit = "3.0.0"             # HTTP client (brings OkHttp in transitively)
serializationJson = "1.12.0"   # kotlinx.serialization JSON format (Open-Meteo responses)
glance = "1.2.0"              # Glance: home-screen widgets written like Compose
junit = "4.13.2"               # unit test framework (tests only, not shipped in the app)

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# viewModel(...) inside composables
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# collectAsStateWithLifecycle(): read a Flow in the UI, pausing while the app is in the background
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose libraries take their version from the BOM, so they have no version here.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Room: the runtime goes into the app; the compiler only runs at build time (via KSP).
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
# Lets the widget use the app's Material 3 colours (light and dark).
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin by itself ("built-in Kotlin"); Compose still needs this compiler plugin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# kotlinx.serialization compiler plugin: generates serializers for @Serializable
# classes (used for type-safe navigation routes; later for JSON).
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Room's Gradle plugin: configures where the exported database schema is written.
room = { id = "androidx.room", version.ref = "room" }
